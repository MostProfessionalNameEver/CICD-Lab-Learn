name: Injection Demo

on:
  workflow_dispatch:
    inputs:
      title:
        description: Simulated PR title
        required: true
        default: fix typo

jobs:
  vulnerable-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print the title (fixed way)
        env:
          TITLE: ${{ github.event.inputs.title }}
        run: echo "Processing PR titled: $TITLE"
